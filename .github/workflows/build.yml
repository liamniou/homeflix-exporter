name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        # Dependabot-bumpable tag (YYYY.M.D.run) for gitops pins.
        run: echo "tag=$(date -u +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liamniou/homeflix-exporter:latest
            ghcr.io/liamniou/homeflix-exporter:${{ steps.version.outputs.tag }}
            ghcr.io/liamniou/homeflix-exporter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
